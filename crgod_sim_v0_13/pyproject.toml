[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crgod-sim"
version = "0.4.0"
description = "Headless deterministic simulator for CR-God"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["crgod_sim*"]

[project.optional-dependencies]
train = ["torch>=2.0"]
test = ["pytest>=8"]
